<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロンプトライブラリ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#15171c; --panel:#1c1f26; --raise:#23272f; --raise2:#2b3038;
    --line:#31363f; --line2:#3d4450;
    --tx:#e4e7ec; --tx2:#a3aab6; --tx3:#767d8a;
    --pos:#7f8cf0; --posdim:#343a63;
    --neg:#cf6f7e; --negdim:#553038;
    --fav:#d7a247;
    --ok:#5fb392;
    --r:7px;
    --dock:300px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit; color:inherit}
  button{background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--pos); outline-offset:1px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#363c46;border-radius:6px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  .btn{
    border:1px solid var(--line2); border-radius:var(--r); padding:6px 11px;
    color:var(--tx2); background:var(--raise); font-size:13px; white-space:nowrap;
  }
  .btn:hover{background:var(--raise2); color:var(--tx)}
  .btn.on{border-color:var(--pos); color:#c9cffb; background:var(--posdim)}
  .btn.mini{padding:3px 8px; font-size:12px}
  .btn.go{background:var(--pos); border-color:var(--pos); color:#12141c}
  .btn.go:hover{background:#95a0f5; color:#12141c}
  .btn.danger:hover{border-color:var(--neg); color:var(--neg); background:var(--negdim)}
  .fld{
    width:100%; background:#12141a; border:1px solid var(--line); border-radius:var(--r);
    padding:7px 10px; color:var(--tx);
  }
  .fld:focus{border-color:var(--line2); outline:none}
  .fld::placeholder{color:var(--tx3)}
  select.fld{padding:6px 8px}

  .app{display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%}

  .bar{
    display:flex; align-items:center; gap:10px; padding:9px 14px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{font-weight:500; letter-spacing:.01em}
  .stat{color:var(--tx3); font-size:12px}
  .grow{flex:1}

  .body{display:grid; grid-template-columns:210px minmax(0,1fr); min-height:0}

  .side{
    border-right:1px solid var(--line); background:var(--panel);
    overflow-y:auto; padding:12px 10px;
  }
  .sect{color:var(--tx3); font-size:11.5px; margin:2px 2px 6px}
  .sect.sp{margin-top:16px}
  .nav{display:block; width:100%; text-align:left; padding:6px 9px; border-radius:var(--r);
       color:var(--tx2); font-size:13px; display:flex; gap:8px; align-items:center}
  .nav:hover{background:var(--raise)}
  .nav.on{background:var(--raise2); color:var(--tx)}
  .nav .n{margin-left:auto; color:var(--tx3); font-size:11.5px; font-variant-numeric:tabular-nums}
  .tagwrap{display:flex; flex-wrap:wrap; gap:5px; padding:0 2px}
  .tag{border:1px solid var(--line); border-radius:20px; padding:2px 9px; font-size:11.5px; color:var(--tx2)}
  .tag:hover{border-color:var(--line2)}
  .tag.on{background:var(--posdim); border-color:var(--pos); color:#c9cffb}

  .main{display:grid; grid-template-rows:auto auto minmax(0,1fr); min-height:0}
  .tools{display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line)}
  .search{flex:1; min-width:0}
  .list{overflow-y:auto; padding:8px 14px 18px}

  .row{
    display:flex; align-items:center; gap:10px; padding:9px 11px; margin-bottom:5px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px; cursor:pointer;
  }
  .row:hover{border-color:var(--line2); background:var(--raise)}
  .row.neg{border-left:3px solid var(--neg)}
  .row.pos{border-left:3px solid var(--pos)}
  .rmain{min-width:0; flex:1}
  .rname{font-size:13.5px; margin-bottom:2px; display:flex; align-items:center; gap:6px}
  .rtext{font-family:var(--mono); font-size:12px; color:var(--tx2); overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap}
  .rcat{font-size:11.5px; color:var(--tx3); white-space:nowrap}
  .ract{display:flex; gap:2px; opacity:.45; transition:opacity .12s}
  .row:hover .ract, .row:focus-within .ract{opacity:1}
  .chk{width:17px;height:17px;flex:none;border:1px solid var(--line2);border-radius:4px;
       display:grid;place-items:center;color:transparent;font-size:11px;line-height:1}
  .chk:hover{border-color:var(--tx3)}
  .chk.on{background:var(--pos);border-color:var(--pos);color:#12141c}
  .row.sel{background:var(--posdim); border-color:var(--pos)}
  .selbar{display:none; align-items:center; gap:8px; margin:10px 14px 0; padding:8px 11px;
          background:var(--posdim); border:1px solid var(--pos); border-radius:9px; font-size:13px}
  .selbar.on{display:flex}
  .toast .undo{margin-left:12px; color:var(--pos); font-size:13px; text-decoration:underline}
  .toast.on{pointer-events:auto}
  .ico{width:26px;height:26px;border-radius:6px;color:var(--tx3);display:grid;place-items:center;font-size:14px}
  .ico:hover{background:var(--raise2); color:var(--tx)}
  .star{color:var(--tx3); font-size:14px}
  .star.on{color:var(--fav); opacity:1}
  .row .star.on{opacity:1}
  .uses{font-size:11px; color:var(--tx3); font-variant-numeric:tabular-nums; min-width:22px; text-align:right}
  .empty{color:var(--tx3); text-align:center; padding:48px 20px; font-size:13.5px; line-height:2}

  .handle{height:7px; cursor:row-resize; background:var(--panel); border-top:1px solid var(--line)}
  .handle:hover{background:var(--raise2)}
  .dock{background:var(--panel); border-top:1px solid var(--line); height:var(--dock);
        display:grid; grid-template-rows:auto minmax(0,1fr); min-height:0}
  .tabs{display:flex; gap:4px; align-items:center; padding:7px 12px 0; overflow-x:auto}
  .tab{padding:5px 12px; border-radius:var(--r) var(--r) 0 0; font-size:13px; color:var(--tx3); white-space:nowrap}
  .tab:hover{color:var(--tx2); background:var(--raise)}
  .tab.on{background:var(--raise2); color:var(--tx)}
  .dockbody{overflow-y:auto; padding:10px 12px 14px}
  .zone{margin-bottom:10px}
  .zhead{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .zlab{font-size:12px; color:var(--tx2)}
  .zlab b{font-weight:500; color:var(--tx3); font-variant-numeric:tabular-nums; margin-left:4px}
  .chips{display:flex; flex-wrap:wrap; gap:5px; min-height:34px; padding:5px;
         border:1px dashed var(--line); border-radius:var(--r)}
  .chips.over{border-color:var(--pos); background:#191c2b}
  .chip{display:flex; align-items:center; gap:2px; background:var(--raise2); border:1px solid var(--line2);
        border-radius:var(--r); padding:2px 3px 2px 7px; font-size:12.5px; cursor:grab}
  .chip.drag{opacity:.35}
  .chip .cn{max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip .w{font-family:var(--mono); font-size:11px; color:var(--pos); margin:0 2px}
  .chip.n .w{color:var(--neg)}
  .wbtn{width:18px;height:20px;border-radius:4px;color:var(--tx3);font-size:13px;line-height:1}
  .wbtn:hover{background:#3a414d; color:var(--tx)}
  .xbtn{width:20px;height:20px;border-radius:4px;color:var(--tx3);font-size:13px;margin-left:2px}
  .xbtn:hover{background:var(--negdim); color:var(--neg)}
  .out{width:100%; min-height:62px; resize:vertical; background:#12141a; border:1px solid var(--line);
       border-radius:var(--r); padding:9px 10px; font-family:var(--mono); font-size:12.5px;
       line-height:1.65; color:var(--tx)}
  .hint{color:var(--tx3); font-size:11.5px}

  .modal{position:fixed; inset:0; background:rgba(8,9,12,.66); display:none; place-items:center; z-index:40; padding:20px}
  .modal.on{display:grid}
  .card{background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:18px 18px 16px;
        width:min(520px,100%); max-height:88vh; overflow-y:auto}
  .card h3{margin:0 0 14px; font-size:15px; font-weight:500}
  .f{margin-bottom:11px}
  .f label{display:block; font-size:12px; color:var(--tx2); margin-bottom:4px}
  .f textarea{min-height:74px; resize:vertical; font-family:var(--mono); font-size:12.5px}
  .fr{display:flex; gap:10px}
  .fr>*{flex:1}
  .acts{display:flex; gap:8px; justify-content:flex-end; margin-top:16px}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--raise2);
         border:1px solid var(--line2); border-radius:20px; padding:8px 18px; font-size:13px;
         opacity:0; pointer-events:none; transition:opacity .2s; z-index:60}
  .toast.on{opacity:1}
  .menu{position:absolute; background:var(--raise); border:1px solid var(--line2); border-radius:9px;
        padding:5px; min-width:190px; z-index:50; display:none}
  .menu.on{display:block}
  .menu button{display:block; width:100%; text-align:left; padding:7px 10px; border-radius:6px;
               font-size:13px; color:var(--tx2)}
  .menu button:hover{background:var(--raise2); color:var(--tx)}
  .menu hr{border:0; border-top:1px solid var(--line); margin:5px 0}

  @media (max-width:820px){
    .body{grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr)}
    .side{border-right:0; border-bottom:1px solid var(--line); max-height:150px}
    .chip .cn{max-width:120px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <span class="brand">プロンプトライブラリ</span>
    <span class="stat" id="stat"></span>
    <span class="grow"></span>
    <button class="btn" id="bNew">新規追加</button>
    <button class="btn" id="bImp">取り込み</button>
    <button class="btn" id="bExp">書き出し</button>
    <button class="btn" id="bSet">設定</button>
  </header>

  <div class="body">
    <aside class="side">
      <div class="sect">種別</div>
      <div style="display:flex;gap:5px;margin-bottom:4px">
        <button class="btn mini kind on" data-kind="all" style="flex:1">両方</button>
        <button class="btn mini kind" data-kind="pos" style="flex:1">ポジ</button>
        <button class="btn mini kind" data-kind="neg" style="flex:1">ネガ</button>
      </div>
      <div class="sect sp">カテゴリ</div>
      <div id="cats"></div>
      <div class="sect sp">タグ</div>
      <div class="tagwrap" id="tags"></div>
    </aside>

    <main class="main">
      <div class="tools">
        <input class="fld search" id="q" placeholder="表示名・プロンプト・タグを検索（スペース区切りで絞り込み）">
        <select class="fld" id="sort" style="width:150px">
          <option value="new">追加が新しい順</option>
          <option value="fav">お気に入り優先</option>
          <option value="uses">使用回数が多い順</option>
          <option value="name">表示名順</option>
        </select>
        <button class="btn" id="bSelAll">すべて選択</button>
        <button class="btn danger" id="bDelF" style="display:none">表示中を削除</button>
      </div>
      <div class="selbar" id="selbar"></div>
      <div class="list" id="list">
        <div id="rows"></div>
      </div>
    </main>
  </div>

  <div class="handle" id="handle" title="ドラッグで高さ調整"></div>
  <section class="dock">
    <div class="tabs" id="tabs"></div>
    <div class="dockbody">
      <div class="zone">
        <div class="zhead">
          <span class="zlab">ポジティブ<b id="cP">0</b></span>
          <span class="grow" style="flex:1"></span>
          <button class="btn mini" id="cpP">コピー</button>
          <button class="btn mini danger" id="clP">消去</button>
        </div>
        <div class="chips" id="chipsP" data-k="pos"></div>
      </div>
      <div class="zone">
        <div class="zhead">
          <span class="zlab" style="color:var(--neg)">ネガティブ<b id="cN">0</b></span>
          <span class="grow" style="flex:1"></span>
          <button class="btn mini" id="cpN">コピー</button>
          <button class="btn mini danger" id="clN">消去</button>
        </div>
        <div class="chips" id="chipsN" data-k="neg"></div>
      </div>
      <div class="zone">
        <div class="zhead">
          <span class="zlab">出力</span>
          <span class="grow" style="flex:1"></span>
          <span class="hint" id="hint"></span>
          <button class="btn mini" id="cpAll">全文コピー</button>
          <button class="btn mini" id="dlTxt">.txtで保存</button>
        </div>
        <textarea class="out" id="out" readonly></textarea>
        <div style="margin-top:7px">
          <input class="fld" id="free" placeholder="追記（出力の末尾に足されます）" style="font-family:var(--mono);font-size:12.5px">
        </div>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="mEdit"><div class="card">
  <h3 id="edTitle">プロンプトを追加</h3>
  <div class="fr">
    <div class="f"><label>カテゴリ</label><input class="fld" id="eCat" list="catList" placeholder="オリジナルキャラ"><datalist id="catList"></datalist></div>
    <div class="f"><label>種別</label><select class="fld" id="eKind"><option value="pos">ポジティブ</option><option value="neg">ネガティブ</option></select></div>
  </div>
  <div class="f"><label>表示名</label><input class="fld" id="eName" placeholder="一覧に表示される名前"></div>
  <div class="f"><label>プロンプト</label><textarea class="fld" id="eText" placeholder="silver hair, red eyes"></textarea></div>
  <div class="f"><label>タグ（, 区切り・任意）</label><input class="fld" id="eTags" placeholder="自作, 女性"></div>
  <div class="f"><label>メモ（任意）</label><input class="fld" id="eNote"></div>
  <div class="acts">
    <button class="btn" data-close>キャンセル</button>
    <button class="btn go" id="eSave">保存</button>
  </div>
</div></div>

<div class="modal" id="mImp"><div class="card">
  <h3>取り込み方法</h3>
  <p style="color:var(--tx2);font-size:13px;margin:0 0 6px" id="impInfo"></p>
  <p style="color:var(--tx3);font-size:12px;margin:0 0 4px">「追加」では、プロンプト本文が既存と同じ行は飛ばします。</p>
  <div class="acts">
    <button class="btn" data-close>キャンセル</button>
    <button class="btn danger" id="impRep">全置換</button>
    <button class="btn go" id="impAdd">追加する</button>
  </div>
</div></div>

<div class="modal" id="mSet"><div class="card">
  <h3>設定</h3>
  <div class="f"><label><input type="checkbox" id="sDup"> 同じプロンプトの重複追加を許可する</label></div>
  <div class="f"><label>重みの刻み</label><select class="fld" id="sStep" style="width:120px">
    <option value="0.05">0.05</option><option value="0.1">0.1</option></select></div>
  <div class="f"><label>重みの書式</label><select class="fld" id="sFmt">
    <option value="paren">(word:1.20)</option>
    <option value="brace">{word:1.20}</option>
    <option value="none">重みを出力しない</option></select></div>
  <div class="f"><label>区切り文字</label><select class="fld" id="sSep">
    <option value=", ">,␣（カンマ+スペース）</option>
    <option value=",">,（カンマのみ）</option>
    <option value=",\n">,+改行</option></select></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
  <p style="color:var(--tx3);font-size:12px;margin:0 0 10px">データはこのアプリ内に自動保存されます。念のため、ときどきJSONで書き出して手元に残してください。</p>
  <div class="acts"><button class="btn go" data-close>閉じる</button></div>
</div></div>

<div class="menu" id="expMenu">
  <button data-x="xlsx">Excel (.xlsx) で書き出し</button>
  <button data-x="csv">CSV で書き出し</button>
  <hr>
  <button data-x="json">JSON バックアップを保存</button>
  <button data-x="tpl">取り込み用テンプレートを作る</button>
</div>

<input type="file" id="file" accept=".xlsx,.xls,.csv,.json" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var K_LIB="plib.library.v1", K_MEM="plib.memos.v1", K_CFG="plib.config.v1";
var DEFCATS=["オリジナルキャラ","体位","行為","その他"];

var mem={};
var store={
  get:function(k){
    if(window.storage&&window.storage.get){
      return window.storage.get(k).then(function(r){return r?JSON.parse(r.value):null}).catch(function(){return null});
    }
    return Promise.resolve(mem[k]||null);
  },
  set:function(k,v){
    mem[k]=v;
    if(window.storage&&window.storage.set){
      return window.storage.set(k,JSON.stringify(v)).catch(function(){return null});
    }
    return Promise.resolve();
  }
};

var S={
  prompts:[], cats:DEFCATS.slice(),
  tabs:[{id:"t1",name:"シーン1",pos:[],neg:[],free:""}], active:"t1",
  cfg:{dup:false,step:0.05,fmt:"paren",sep:", "},
  f:{kind:"all",cat:"",tag:"",q:""},
  sort:"new", editing:null, pending:null, sel:{}, undo:null
};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

var tq=null;
function toast(m,undoLabel){
  var t=$("#toast");
  t.innerHTML='<span></span>';
  t.firstChild.textContent=m;
  if(undoLabel){
    var b=document.createElement("button");
    b.className="undo";b.textContent=undoLabel;
    b.addEventListener("click",doUndo);
    t.appendChild(b);
  }
  t.classList.add("on");
  clearTimeout(tq);tq=setTimeout(function(){t.classList.remove("on")},undoLabel?9000:1700);
}
function hideToast(){clearTimeout(tq);$("#toast").classList.remove("on")}

var sq=null;
function save(){clearTimeout(sq);sq=setTimeout(function(){
  store.set(K_LIB,{prompts:S.prompts,cats:S.cats});
  store.set(K_MEM,{tabs:S.tabs,active:S.active});
  store.set(K_CFG,S.cfg);
},350)}

function tab(){var t=null;for(var i=0;i<S.tabs.length;i++)if(S.tabs[i].id===S.active)t=S.tabs[i];
  return t||S.tabs[0]}

/* ---------- 出力 ---------- */
function wrapW(text,w){
  w=Math.round(w*100)/100;
  if(w===1||S.cfg.fmt==="none")return text;
  var n=w.toFixed(2);
  return S.cfg.fmt==="brace"?"{"+text+":"+n+"}":"("+text+":"+n+")";
}
function build(list){
  return list.map(function(c){return wrapW(c.text,c.w)}).join(S.cfg.sep);
}
function outText(){
  var t=tab(),p=build(t.pos),n=build(t.neg),s="";
  if(t.free&&t.free.trim())p=p?p+S.cfg.sep+t.free.trim():t.free.trim();
  if(p)s+=p;
  if(n)s+=(s?"\n\n":"")+"Negative: "+n;
  return s;
}

/* ---------- 描画 ---------- */
function counts(){
  var m={},i,p;
  for(i=0;i<S.prompts.length;i++){p=S.prompts[i];
    if(S.f.kind!=="all"&&p.kind!==S.f.kind)continue;
    m[p.cat]=(m[p.cat]||0)+1}
  return m;
}
function renderSide(){
  var c=counts(),tot=0,k;
  for(k in c)tot+=c[k];
  var cats=S.cats.slice();
  for(var i=0;i<S.prompts.length;i++)if(cats.indexOf(S.prompts[i].cat)<0)cats.push(S.prompts[i].cat);
  var h='<button class="nav'+(S.f.cat===""?" on":"")+'" data-c="">すべて<span class="n">'+tot+'</span></button>';
  h+=cats.map(function(x){return '<button class="nav'+(S.f.cat===x?" on":"")+'" data-c="'+esc(x)+'">'+
    esc(x)+'<span class="n">'+(c[x]||0)+'</span></button>'}).join("");
  $("#cats").innerHTML=h;
  var tg={},j;
  for(i=0;i<S.prompts.length;i++)for(j=0;j<S.prompts[i].tags.length;j++)tg[S.prompts[i].tags[j]]=1;
  var keys=Object.keys(tg).sort();
  $("#tags").innerHTML=keys.length?keys.map(function(x){return '<button class="tag'+
    (S.f.tag===x?" on":"")+'" data-t="'+esc(x)+'">'+esc(x)+'</button>'}).join(""):
    '<span class="hint">タグはまだありません</span>';
  $("#catList").innerHTML=cats.map(function(x){return '<option value="'+esc(x)+'">'}).join("");
  $("#stat").textContent=S.prompts.length+" 件登録";
}
function filtered(){
  var q=S.f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var r=S.prompts.filter(function(p){
    if(S.f.kind!=="all"&&p.kind!==S.f.kind)return false;
    if(S.f.cat&&p.cat!==S.f.cat)return false;
    if(S.f.tag&&p.tags.indexOf(S.f.tag)<0)return false;
    if(q.length){
      var hay=(p.name+" "+p.text+" "+p.tags.join(" ")+" "+p.note+" "+p.cat).toLowerCase();
      for(var i=0;i<q.length;i++)if(hay.indexOf(q[i])<0)return false;
    }
    return true;
  });
  var by={
    new:function(a,b){return b.created-a.created},
    name:function(a,b){return a.name.localeCompare(b.name,"ja")},
    uses:function(a,b){return b.uses-a.uses||b.created-a.created},
    fav:function(a,b){return (b.fav?1:0)-(a.fav?1:0)||b.uses-a.uses||b.created-a.created}
  };
  return r.sort(by[S.sort]);
}
function selIds(){return Object.keys(S.sel).filter(function(k){return S.sel[k]})}
function delPrompts(ids){
  if(!ids.length)return;
  var set={},i;for(i=0;i<ids.length;i++)set[ids[i]]=1;
  S.undo=S.prompts.filter(function(p){return set[p.id]});
  S.prompts=S.prompts.filter(function(p){return !set[p.id]});
  for(i=0;i<ids.length;i++)delete S.sel[ids[i]];
  render();save();
  toast(S.undo.length+" 件を削除しました","元に戻す");
}
function doUndo(){
  if(!S.undo||!S.undo.length){toast("戻せるものがありません");return}
  S.prompts=S.prompts.concat(S.undo);
  var n=S.undo.length;S.undo=null;
  hideToast();render();save();toast(n+" 件を戻しました");
}
function renderSelbar(){
  var n=selIds().length,b=$("#selbar");
  b.classList.toggle("on",n>0);

  b.innerHTML='<span>'+n+' 件を選択中</span><span style="flex:1"></span>'+

    '<button class="btn mini danger" data-s="del">選択した '+n+' 件を削除</button>';

function renderList(){

      "まだ何も入っていません。<br>「取り込み」でExcelを読み込むか、「新規追加」から1件登録してください。")+'</div>';

      '<button class="chk'+(on?" on":"")+'" data-a="sel" role="checkbox" aria-checked="'+on+
        '" aria-label="選択">✓</button>'+
      '<div class="rmain"><div class="rname">'+esc(p.name||"(名称なし)")+
        (p.fav?' <span class="star on">★</span>':"")+'</div>'+

      '<span class="rcat">'+esc(p.cat)+'</span>'+

function chipHTML(c,k){

/* ---------- 操作 ---------- */
function addToMemo(p,quiet){
  var t=tab(),arr=p.kind==="neg"?t.neg:t.pos,i;
  if(!S.cfg.dup)for(i=0;i<arr.length;i++)if(arr[i].text===p.text){
    if(!quiet)toast("すでに入っています");return}
  arr.push({cid:uid(),pid:p.id,name:p.name,text:p.text,w:1});
  p.uses=(p.uses||0)+1;
  if(quiet)return;
  renderList();renderDock();save();
}
function findChip(cid){
  var t=tab(),k,arr,i;
  for(k in {pos:1,neg:1}){arr=t[k];for(i=0;i<arr.length;i++)if(arr[i].cid===cid)return {arr:arr,i:i,c:arr[i]}}
  return null;
}
function copy(txt){
  if(!txt){toast("コピーするものがありません");return}
  var ok=function(){toast("コピーしました")};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt,ok)});
  }else fallback(txt,ok);
}
function fallback(txt,ok){
  var a=document.createElement("textarea");a.value=txt;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("コピーできませんでした")}
  document.body.removeChild(a);
}
function dl(name,content,type){
  var b=new Blob([content],{type:type||"text/plain;charset=utf-8"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},800);
}

/* ---------- 取り込み ---------- */
var HEAD={
  cat:["カテゴリ","分類","category","cat"],
  name:["表示名","名前","名称","ラベル","name","label","title"],
  text:["プロンプト","本文","内容","prompt","text","value"],
  tags:["タグ","tag","tags"],
  note:["メモ","備考","説明","note","memo","description"],
  kind:["種別","タイプ","kind","type"]
};
function mapRow(row){
  var o={cat:"",name:"",text:"",tags:"",note:"",kind:""},k,key,i,keys=Object.keys(row);
  for(k in HEAD)for(i=0;i<keys.length;i++){
    key=String(keys[i]).trim().toLowerCase();
    if(HEAD[k].indexOf(key)>=0&&!o[k])o[k]=row[keys[i]];
  }
  if(!o.text){ // ヘッダー名が合わない場合は列順で拾う
    var v=keys.map(function(x){return row[x]});
    o.cat=o.cat||v[0]||""; o.name=o.name||v[1]||""; o.text=v[2]||v[1]||v[0]||"";
    o.tags=o.tags||v[3]||""; o.note=o.note||v[4]||"";
  }
  return o;
}
function toPrompt(o){
  var text=String(o.text==null?"":o.text).trim();
  if(!text)return null;
  var kind=/neg|ネガ|除外|マイナス/i.test(String(o.kind||""))?"neg":"pos";
  var cat=String(o.cat||"").trim()||"その他";
  return {id:uid(),cat:cat,name:String(o.name||"").trim()||text.slice(0,28),text:text,
    tags:String(o.tags||"").split(/[,、\s]+/).map(function(s){return s.trim()}).filter(Boolean),
    note:String(o.note||"").trim(),kind:kind,fav:false,uses:0,created:Date.now()-Math.random()};
}
function readFile(f){
  var r=new FileReader();
  if(/\.json$/i.test(f.name)){
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d.prompts)throw 0;
        S.pending={rows:d.prompts,isBackup:true,tabs:d.tabs,cats:d.cats};
        $("#impInfo").textContent="バックアップJSON："+d.prompts.length+" 件。全置換すると、メモ欄のタブも復元されます。";
        $("#mImp").classList.add("on");
      }catch(e){toast("このJSONは読み込めません")}
    };
    r.readAsText(f);return;
  }
  r.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(r.result),{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      var out=rows.map(function(x){return toPrompt(mapRow(x))}).filter(Boolean);
      if(!out.length){toast("読み取れる行がありませんでした");return}
      S.pending={rows:out,isBackup:false};
      $("#impInfo").textContent=f.name+" から "+out.length+" 件を読み取りました。";
      $("#mImp").classList.add("on");
    }catch(e){toast("ファイルを読み込めませんでした")}
  };
  r.readAsArrayBuffer(f);
}
function applyImport(replace){
  var p=S.pending;if(!p)return;
  var rows=p.isBackup?p.rows:p.rows;
  if(replace){
    S.prompts=rows.slice();
    if(p.isBackup){
      if(p.cats)S.cats=p.cats;
      if(p.tabs&&p.tabs.length){S.tabs=p.tabs;S.active=p.tabs[0].id}
    }
    toast(S.prompts.length+" 件に置き換えました");
  }else{
    var have={},i,n=0;
    for(i=0;i<S.prompts.length;i++)have[S.prompts[i].text]=1;
    for(i=0;i<rows.length;i++)if(!have[rows[i].text]){
      rows[i].id=uid();S.prompts.push(rows[i]);have[rows[i].text]=1;n++}
    toast(n+" 件追加しました（重複 "+(rows.length-n)+" 件は除外）");
  }
  for(var j=0;j<S.prompts.length;j++)if(S.cats.indexOf(S.prompts[j].cat)<0)S.cats.push(S.prompts[j].cat);
  S.pending=null;$("#mImp").classList.remove("on");render();save();
}
function sheetRows(){
  return S.prompts.map(function(p){
    return {"カテゴリ":p.cat,"表示名":p.name,"プロンプト":p.text,
      "タグ":p.tags.join(", "),"メモ":p.note,"種別":p.kind==="neg"?"ネガ":"ポジ"};
  });
}
function expo(kind){
  if(kind==="json"){
    dl("prompt-library-"+Date.now()+".json",
      JSON.stringify({v:1,prompts:S.prompts,cats:S.cats,tabs:S.tabs},null,1),"application/json");
    toast("JSONを保存しました");return;
  }
  if(kind==="tpl"){
    var t=[{"カテゴリ":"オリジナルキャラ","表示名":"ミナ","プロンプト":"silver hair, red eyes","タグ":"自作, 女性","メモ":"基本形","種別":"ポジ"},
           {"カテゴリ":"その他","表示名":"低品質除外","プロンプト":"lowres, bad anatomy","タグ":"共通","メモ":"","種別":"ネガ"}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(t),"prompts");
    XLSX.writeFile(wb,"取り込みテンプレート.xlsx");return;
  }
  if(!S.prompts.length){toast("書き出すデータがありません");return}
  var wb2=XLSX.utils.book_new();
  var ws=XLSX.utils.json_to_sheet(sheetRows());
  ws["!cols"]=[{wch:16},{wch:22},{wch:52},{wch:18},{wch:20},{wch:8}];
  XLSX.utils.book_append_sheet(wb2,ws,"prompts");
  XLSX.writeFile(wb2,"prompt-library."+(kind==="csv"?"csv":"xlsx"));
}

function chipClick(e){
  var ch=e.target.closest(".chip");if(!ch)return;
  var act=e.target.closest("[data-a]");if(!act)return;
  var f=findChip(ch.dataset.c);if(!f)return;
  var a=act.dataset.a,st=parseFloat(S.cfg.step);
  if(a==="rm")f.arr.splice(f.i,1);
  if(a==="up")f.c.w=Math.min(2,Math.round((f.c.w+st)*100)/100);
  if(a==="dn")f.c.w=Math.max(0.1,Math.round((f.c.w-st)*100)/100);
  renderDock();save();
}

/* 並べ替え */
var dragId=null;
function dragSetup(box){
  box.addEventListener("dragstart",function(e){
    var ch=e.target.closest(".chip");if(!ch)return;
    dragId=ch.dataset.c;ch.classList.add("drag");e.dataTransfer.effectAllowed="move";
    try{e.dataTransfer.setData("text/plain",dragId)}catch(x){}
  });
  box.addEventListener("dragend",function(){dragId=null;renderDock()});
  box.addEventListener("dragover",function(e){e.preventDefault();box.classList.add("over")});
  box.addEventListener("dragleave",function(){box.classList.remove("over")});
  box.addEventListener("drop",function(e){
    e.preventDefault();box.classList.remove("over");
    if(!dragId)return;
    var f=findChip(dragId);if(!f)return;
    var t=tab(),dest=box.dataset.k==="neg"?t.neg:t.pos;
    var item=f.arr.splice(f.i,1)[0];
    var over=e.target.closest(".chip"),at=dest.length,i;
    if(over){for(i=0;i<dest.length;i++)if(dest[i].cid===over.dataset.c)at=i}
    dest.splice(at,0,item);
    dragId=null;renderDock();save();
  });
}

/* 取り込み / 書き出し */
$("#bImp").addEventListener("click",function(){$("#file").click()});
$("#file").addEventListener("change",function(){if(this.files[0])readFile(this.files[0]);this.value=""});
$("#impAdd").addEventListener("click",function(){applyImport(false)});
$("#impRep").addEventListener("click",function(){
  if(confirm("いまの "+S.prompts.length+" 件を消して置き換えます。よろしいですか？"))applyImport(true)});
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("drop",function(e){
  e.preventDefault();
  if(e.dataTransfer.files&&e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);
});
$("#bExp").addEventListener("click",function(e){
  var m=$("#expMenu"),r=this.getBoundingClientRect();
  m.style.top=(r.bottom+6)+"px";m.style.left=Math.max(8,r.right-200)+"px";
  m.classList.toggle("on");e.stopPropagation();
});
document.addEventListener("click",function(){$("#expMenu").classList.remove("on")});
$("#expMenu").addEventListener("click",function(e){
  var b=e.target.closest("[data-x]");if(!b)return;
  $("#expMenu").classList.remove("on");expo(b.dataset.x);
});

/* 設定 */
$("#bSet").addEventListener("click",function(){
  $("#sDup").checked=S.cfg.dup;$("#sStep").value=String(S.cfg.step);
  $("#sFmt").value=S.cfg.fmt;$("#sSep").value=(S.cfg.sep==",\n")?",\\n":S.cfg.sep;
  $("#mSet").classList.add("on");
});
$("#sDup").addEventListener("change",function(){S.cfg.dup=this.checked;save()});
$("#sStep").addEventListener("change",function(){S.cfg.step=parseFloat(this.value);save()});
$("#sFmt").addEventListener("change",function(){S.cfg.fmt=this.value;renderDock();save()});
$("#sSep").addEventListener("change",function(){
  S.cfg.sep=(this.value===",\\n")?",\n":this.value;renderDock();save()});

/* ドック高さ */
(function(){
  var h=$("#handle"),drag=false;
  h.addEventListener("pointerdown",function(e){drag=true;h.setPointerCapture(e.pointerId)});
  h.addEventListener("pointermove",function(e){
    if(!drag)return;
    var v=Math.min(window.innerHeight*0.72,Math.max(140,window.innerHeight-e.clientY));
    document.documentElement.style.setProperty("--dock",v+"px");
  });
  h.addEventListener("pointerup",function(){drag=false});
})();

/* 起動 */
Promise.all([store.get(K_LIB),store.get(K_MEM),store.get(K_CFG)]).then(function(r){
  if(r[0]&&r[0].prompts){S.prompts=r[0].prompts;if(r[0].cats)S.cats=r[0].cats}
  if(r[1]&&r[1].tabs&&r[1].tabs.length){S.tabs=r[1].tabs;S.active=r[1].active||r[1].tabs[0].id}
  if(r[2])for(var k in r[2])S.cfg[k]=r[2][k];
  for(var i=0;i<S.prompts.length;i++){
    var p=S.prompts[i];
    if(!p.tags)p.tags=[];if(!p.kind)p.kind="pos";if(!p.uses)p.uses=0;if(!p.created)p.created=i;
  }
  render();
}).catch(function(){render()});
})();
</script>
